version: "3.8"

services:

  db:
    image: postgres:18
    container_name: ra-db  # By using the exact container name and volume, data is preserved
    restart: unless-stopped
    environment:
      POSTGRES_DB: Redangle-Preproduction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql  # This mounts your existing database volume
    ports:
      - "6000:5432"
    networks:
      - redangle-preproduction-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Redangle-Preproduction"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: dinesh0793/ra-backend:latest
    container_name: redangle-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"
    env_file:
      - /home/ubuntu/RA/RA-Backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - /home/ubuntu/RA-storage/uploads:/app/uploads
    networks:
      - redangle-preproduction-net

  frontend:
    image: dinesh0793/ra-frontend:latest
    container_name: ra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:5174"
    env_file:
      - /home/ubuntu/RA/RA-Frontend/.env
    networks:
      - redangle-preproduction-net

  caddy:
    image: caddy:2-alpine
    container_name: ra-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - redangle-preproduction-net
    depends_on:
      - frontend
      - backend

volumes:
  # Setting this explicitly forces Docker to connect to the existing v1 db_data volume.
  db_data:
    external: true
  caddy_data:
  caddy_config:

networks:
  redangle-preproduction-net:
    driver: bridge
